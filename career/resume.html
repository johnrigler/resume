<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resume Builder | John Rigler</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172538;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}header{padding:1rem max(1rem,calc((100vw - 860px)/2));background:#20364c;color:white}header a{color:#d8eefa}.wrap{max-width:860px;margin:auto;padding:1rem}.controls{background:white;border:1px solid #d8dfe6;border-radius:8px;padding:1rem;margin-bottom:1rem;display:flex;gap:1rem;align-items:end;flex-wrap:wrap}.controls label{display:block;font-size:.85rem;color:#475569;margin-bottom:.3rem}.controls select,.controls button{font:inherit;padding:.6rem;border-radius:5px;border:1px solid #a8b6c5;background:white}.controls button{background:#155d91;color:white;cursor:pointer;border-color:#155d91}.page{background:white;max-width:816px;min-height:1056px;margin:auto;padding:46px 54px;box-shadow:0 4px 22px #0002}.resume-head{border-bottom:2px solid #22394c;padding-bottom:12px;margin-bottom:16px}.resume-head h1{font-size:27px;letter-spacing:.05em;margin:0}.resume-head p{font-size:11px;color:#566575;margin:5px 0 0}h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid #ccd5dd;padding-bottom:4px;margin:18px 0 7px}h3{font-size:12px;margin:0}.date{font-size:11px;color:#566575;white-space:nowrap}p,li{font-size:11.5px;line-height:1.45;margin:5px 0}.entry{break-inside:avoid;margin:10px 0}.line{display:flex;justify-content:space-between;gap:1rem}.sub{font-size:11px;color:#425569;margin-top:2px}.notice{font-size:.8rem;color:#654b16;background:#fff7e1;padding:.65rem 1rem;margin-bottom:1rem;border-left:3px solid #b58d31}.muted{color:#526273}#error{color:#9a2020}@page{size:letter;margin:0}@media print{html,body{background:white}.no-print{display:none!important}.wrap{max-width:none;padding:0}.page{box-shadow:none;margin:0;max-width:none;min-height:0;padding:.56in .65in}h2{margin-top:14px}}@media(max-width:650px){.page{padding:24px;min-height:0}.line{flex-direction:column;gap:0}.date{white-space:normal}}
</style></head><body>
<header class="no-print"><strong>Career Lab · Resume Builder</strong> <span style="float:right"><a href="index.html">Career Lab home</a></span></header>
<div class="wrap"><div class="controls no-print">
<div><label for="profile">Resume profile</label><select id="profile"><option value="enterprise-support">Enterprise Support Engineer</option><option value="infrastructure">Infrastructure / DevOps</option><option value="customer-support">Customer / Technical Support</option><option value="technical-advisor">Principal Technical Advisor / Architect</option></select></div>
<div><label for="dates">Dates</label><select id="dates"><option value="recent">Recent dates; older experience undated</option><option value="all">Show recorded dates</option></select></div>
<div><label for="leadership">Presentation lens</label><select id="leadership"><option value="off">Standard</option><option value="on">Strategic technical leadership</option></select></div><button id="print" type="button">Print / Save PDF</button><button id="copy" type="button">Copy text</button>
</div><p class="notice no-print">Draft generator. Reconcile flagged dates before submitting. The source JSON is public, but private verification documents must stay outside GitHub. PDF output uses your browser's print dialog.</p><div id="error" class="no-print" role="status"></div><div class="page" id="resume"></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const contact={name:'John Rigler',location:'Grants / Milan, New Mexico',email:'john.rigler@protonmail.com',phone:'682-666-0614',linkedin:'linkedin.com/in/jrigler'};
const fallback={entries:[
{id:'acoma',employer:'Acoma Business Enterprises',role:'Cashier / Food Service',displayDate:'Dec 2025–Present',start:'2025-12',dateStatus:'payroll-confirmed-as-of-2026-08',summary:'Frontline cashier and food service work while establishing community connections in western New Mexico.'},
{id:'softlayer',employer:'IBM SoftLayer',role:'Security and Cloud Engineer',displayDate:'Aug 2017–Mar 2019',start:'2017-08',dateStatus:'resume-supported',summary:'Production cloud support, incident response, risk remediation, Linux/FreeBSD and automation.'},
{id:'coinbase',employer:'Coinbase (client), EverythingD (payroll)',role:'Site Reliability / Back-End Engineer',displayDate:'Oct 2021–Jan 2022',start:'2021-10',dateStatus:'client-payroll-distinction',summary:'Production CI/CD, reliability troubleshooting and release support.'},
{id:'total',employer:'Total Ancillary',role:'Cloud Deployment Architect (1099 client)',displayDate:'Jun 2022–Nov 2024 (end date under review)',start:'2022-06',dateStatus:'conflicting-resumes',summary:'Healthcare technology cloud deployments and infrastructure architecture, including proof-of-concept work.'},
{id:'ibm',employer:'IBM',role:'AIX Telephone Technical Support / Unix Systems Administration',displayDate:'1996–2006',start:'1996',dateStatus:'resume-supported',summary:'Remote telephone-bank AIX technical support, technical escalation, Unix operations and infrastructure support.'},
{id:'consulting',employer:'Independent Consulting / Secret Beach Solutions',role:'Infrastructure, DevOps and Security Consultant',displayDate:'Mar 2019–Jun 2022',start:'2019-03',dateStatus:'resume-supported',summary:'Infrastructure engineering, automation, systems integration and client engagements.'},
{id:'bofa',employer:'Bank of America (client), Insight Global (payroll)',role:'Infrastructure / DevOps',displayDate:'Jun 2016–Apr 2017 (payroll)',start:'2016-06',dateStatus:'client-payroll-distinction',summary:'Private cloud operations, configuration management, reporting and automation.'},
{id:'capitalone',employer:'Capital One (client), Global Employment Solutions (payroll)',role:'Infrastructure Analyst / SRE',displayDate:'Aug 2015–Apr 2016 (payroll)',start:'2015-08',dateStatus:'client-payroll-distinction',summary:'Unix fleet inventory, systems automation, SQL reporting and production support.'},
{id:'chisel',employer:'Chisel / Ledger Liberty',role:'Independent technical research',displayDate:'Research phase beginning 2024; conclusion date to confirm',start:'2024',dateStatus:'needs-review',summary:'Finite technical exploration involving vanilla JavaScript, browser interfaces, decentralized ledgers, IPFS, and transaction tooling.'}]};
const profiles={profiles:[
{id:'enterprise-support',name:'Enterprise Support Engineer',summary:'Enterprise technical support and infrastructure engineer with IBM telephone-based AIX troubleshooting, Unix/Linux and cloud operations, production incident response, and customer-facing experience.',include:['acoma','softlayer','coinbase','total','ibm']},
{id:'infrastructure',name:'Infrastructure / DevOps',summary:'Enterprise infrastructure engineer covering Unix/Linux, cloud, security, CI/CD, incident response, automation and independent JavaScript/API tooling.',include:['softlayer','consulting','coinbase','total','bofa','capitalone','chisel']},
{id:'customer-support',name:'Customer / Technical Support',summary:'Customer-facing employee with hands-on remote telephone technical support experience, systems troubleshooting, documentation and operational discipline.',include:['acoma','ibm','softlayer','total']}
],leadershipMode:{label:'Strategic technical leadership',headline:'Principal / Staff Technical Advisor',summary:'Senior enterprise technologist bringing systems-level judgment to cloud infrastructure, reliability, security and application integration. Experienced in technical leadership, architecture and cross-team collaboration, with a preference for individual-contributor or advisory responsibilities over line management.',preferredEvidence:['total','consulting','softlayer','coinbase','bofa','capitalone','ibm']}};
let source=fallback,sets=profiles;const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
function render(){const profile=sets.profiles.find(p=>p.id===$('profile').value)||sets.profiles[0],root=$('resume');root.replaceChildren();const head=el('div',undefined,'resume-head');head.append(el('h1',contact.name),el('p',[contact.location,contact.phone,contact.email,contact.linkedin].join('  |  ')));const strategic=$('leadership').value==='on';const lens=sets.leadershipMode||profiles.leadershipMode;root.append(head,el('h2',strategic?lens.headline:profile.name),el('p',strategic?lens.summary:profile.summary),el('h2','Relevant experience'));
const ids=strategic?[...new Set([...lens.preferredEvidence.filter(id=>profile.include.includes(id)),...profile.include])]:profile.include;const entries=ids.map(id=>source.entries.find(e=>e.id===id)).filter(Boolean);
for(const entry of entries){const section=el('div',undefined,'entry'),line=el('div',undefined,'line');line.append(el('h3',entry.employer));let date=entry.displayDate||'';if($('dates').value==='recent' && /^\d{4}$/.test(entry.start||'')&&Number(entry.start)<2010)date='Selected earlier experience';if(entry.dateStatus==='conflicting-resumes'||entry.dateStatus==='needs-review')date=date.replace(/ \(end date under review\)/,'')+'*';line.append(el('span',date,'date'));section.append(line,el('div',entry.role,'sub'),el('p',entry.summary));root.append(section);}
root.append(el('h2','Education'),el('p',"Bachelor of Arts, with honors · Louisiana Scholars’ College at Northwestern State University"));
if(entries.some(e=>['conflicting-resumes','needs-review'].includes(e.dateStatus)))root.append(el('p','* Date or research-phase boundary requires confirmation before external submission.','muted'));
}
$('profile').addEventListener('change',render);$('dates').addEventListener('change',render);$('leadership').addEventListener('change',render);$('print').addEventListener('click',()=>window.print());$('copy').addEventListener('click',async()=>{const t=$('resume').innerText;try{await navigator.clipboard.writeText(t);$('copy').textContent='Copied';}catch{prompt('Copy resume',t);}});
Promise.all([fetch('data/experience.json').then(r=>{if(!r.ok)throw Error('Experience data unavailable');return r.json();}),fetch('data/profiles.json').then(r=>{if(!r.ok)throw Error('Profiles unavailable');return r.json();})]).then(([a,b])=>{source=a;sets=b;render();}).catch(()=>{$('error').textContent='Using bundled offline snapshot. Open through GitHub Pages or another web server for current JSON records.';render();});render();
</script></body></html>
